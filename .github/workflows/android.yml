name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs (Spanish and Italian)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testSpanishDebugUnitTest testItalianDebugUnitTest assembleDebug assembleRelease

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in app/build/outputs/apk/*/*/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | grep -E "Verified|Signer #1 certificate (DN|SHA-256)|Number of signers"
          done

      - name: Upload Spanish APKs
        uses: actions/upload-artifact@v4
        with:
          name: spanish-blaster-apk
          path: |
            app/build/outputs/apk/spanish/debug/*.apk
            app/build/outputs/apk/spanish/release/*.apk

      - name: Upload Italian APKs
        uses: actions/upload-artifact@v4
        with:
          name: italian-blaster-apk
          path: |
            app/build/outputs/apk/italian/debug/*.apk
            app/build/outputs/apk/italian/release/*.apk
